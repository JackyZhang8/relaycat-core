[package]
name = "relaycat-cli"
version = "0.1.2"
edition.workspace = true
license.workspace = true

[[bin]]
name = "relaycat"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
clap.workspace = true
crossterm = "0.28"
flate2 = "1.0"
futures-util.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
portable-pty.workspace = true
qrcode = { version = "0.14", features = ["image"] }
qr2term = "0.3.3"
ratatui = "0.28"
rand_core = { version = "0.6", features = ["getrandom"] }
relaycat-crypto = { path = "../crypto" }
relaycat-protocol.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json = "1.0"
sha2 = "0.10"
tokio.workspace = true
tokio-tungstenite.workspace = true
vt100 = "0.16"

# Native process metrics on Windows. Reading CPU/memory through the OS APIs
# (no child process) avoids the Microsoft Defender false-positive that a
# repeated `powershell.exe -ExecutionPolicy Bypass` spawn triggers.
[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[dev-dependencies]
assert_cmd = "2.0"
vt100 = "0.16"
